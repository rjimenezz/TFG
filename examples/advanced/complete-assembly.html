<head>
    <title>Assembly Workshop</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
        delete AFRAME.components["grabbable"];
    </script>
    <script
        src="https://cdn.jsdelivr.net/gh/rjimenezz/aframe-free-hands-component@v1.0.5/dist/free-hands.min.js"></script>
</head>

<body>
    <a-scene background="color: #e9f1f7" xr-mode-ui="enabled: true" webxr="optionalFeatures: hand-tracking">
        <a-assets></a-assets>

        <!-- Luces -->
        <a-entity light="type: ambient; intensity: 0.7; color: #ffffff"></a-entity>
        <a-entity light="type: directional; intensity: 0.8; color: #ffffff" position="1 2 1"></a-entity>
        <a-entity light="type: directional; intensity: 0.4; color: #ffffff" position="-1 1 -1"></a-entity>

        <!-- Detectores -->
        <a-entity hands-spheres="enablePinch:true; enablePoint:true; gestureColliderType:obb-collider"></a-entity>

        <!-- Camara -->
        <a-entity camera position="0 1.6 0"></a-entity>

        <!-- Mesa -->
        <a-plane id="table" position="0 1.15 -0.6" rotation="-90 0 0" width="2.8" height="1.1" color="#6a513f"></a-plane>
        <a-box id="table-edge" position="0 1.14 -0.6" width="2.8" height="0.04" depth="1.15" color="#3e2e23"></a-box>

        <!-- Panel UI -->
        <a-entity id="ui" position="0 1.75 -0.7">
            <a-plane id="panel" width="2" height="0.5" color="#0b1d2a" opacity="0.85"
                material="transparent: true"></a-plane>
            <a-entity id="instruction-text" position="0 0.14 0.01"
                text="value: Paso 1: pulsa el boton para iniciar; align: center; color: #ffffff; width: 1.9;"></a-entity>

            <a-box id="start-button" position="0 -0.12 0.03" width="1" height="0.14" depth="0.06" color="#1e90ff"
                material="roughness: 0.3; metalness: 0.1"
                clickable="maxClickers: 1; startGesture: pointstart; endGesture: pointend" hoverable></a-box>
            <a-entity id="start-text" position="0 -0.12 0.08"
                text="value: Iniciar Ensamblaje; align: center; color: #ffffff; width: 2.2;"></a-entity>
        </a-entity>

        <!-- Piezas -->
        <a-entity id="pieces" visible="false">
            <a-box id="piece-cube" class="piece cube" position="-0.8 1.27 -0.5" width="0.12" height="0.12" depth="0.12"
                color="#f39c12" material="roughness:0.3; metalness:0.2" grabbable draggable hoverable
                stretchable></a-box>

            <a-sphere id="piece-sphere" class="piece sphere" position="-0.4 1.35 -0.5" radius="0.18" color="#2ecc71"
                material="roughness:0.3; metalness:0.2" grabbable draggable hoverable stretchable></a-sphere>

            <a-box id="piece-rect" class="piece rect" position="0.0 1.25 -0.5" width="0.22" height="0.08" depth="0.08"
                color="#9b59b6" material="roughness:0.3; metalness:0.2" grabbable draggable
                hoverable stretchable></a-box>
        </a-entity>

        <!-- Moldes -->
        <a-entity id="slots" visible="false">
            <a-plane id="mold-base" position="0.7 1.155 -0.6" rotation="-90 0 0" width="1.0" height="0.5"
                material="color:#00fff0; opacity:0.08; transparent:true"></a-plane>

            <!-- Slot Cubo (Visual y Colisionador Permisivo) -->
            <a-entity id="slot-cube-container" position="0.3 1.25 -0.6">
                <a-box id="slot-cube-visual" width="0.18" height="0.18" depth="0.18"
                    material="color:#00fff0; opacity:0.25; transparent:true; emissive:#00fff0; emissiveIntensity:0.6"></a-box>
                <a-box id="slot-cube" class="slot" width="0.45" height="0.45" depth="0.45"
                    material="visible: false; transparent: true; opacity: 0"
                    droppable="accepts: .piece.cube"></a-box>
            </a-entity>

            <!-- Slot Esfera (Visual y Colisionador Permisivo) -->
            <a-entity id="slot-sphere-container" position="0.7 1.25 -0.6">
                <a-sphere id="slot-sphere-visual" radius="0.10"
                    material="color:#00fff0; opacity:0.25; transparent:true; emissive:#00fff0; emissiveIntensity:0.6"></a-sphere>
                <a-box id="slot-sphere" class="slot" width="0.45" height="0.45" depth="0.45"
                    material="visible: false; transparent: true; opacity: 0"
                    droppable="accepts: .piece.sphere"></a-box>
            </a-entity>

            <!-- Slot Rectangulo (Visual y Colisionador Permisivo) -->
            <a-entity id="slot-rect-container" position="1.1 1.25 -0.6">
                <a-box id="slot-rect-visual" width="0.22" height="0.08" depth="0.08"
                    material="color:#00fff0; opacity:0.25; transparent:true; emissive:#00fff0; emissiveIntensity:0.6"></a-box>
                <a-box id="slot-rect" class="slot" width="0.45" height="0.45" depth="0.45"
                    material="visible: false; transparent: true; opacity: 0"
                    droppable="accepts: .piece.rect"></a-box>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        const startButton = document.querySelector('#start-button');
        const startText = document.querySelector('#start-text');
        const instructionText = document.querySelector('#instruction-text');
        const pieces = document.querySelector('#pieces');
        const slots = document.querySelector('#slots');

        const placed = new Set();
        let started = false;

        const targetSizes = {
            'slot-cube': new THREE.Vector3(0.18, 0.18, 0.18),
            'slot-sphere': new THREE.Vector3(0.20, 0.20, 0.20)
        };

        function setInstruction(text) {
            instructionText.setAttribute(
                'text',
                `value: ${text}; align: center; color: #ffffff; width: 1.9;`
            );
        }

        function getRealSize(el) {
            el.object3D.updateMatrixWorld(true);
            const scale = el.object3D.scale;
            if (el.tagName.toLowerCase() === 'a-sphere') {
                const radius = parseFloat(el.getAttribute('radius')) || 0.5;
                const diameter = radius * 2;
                return new THREE.Vector3(diameter * scale.x, diameter * scale.y, diameter * scale.z);
            } else {
                const width = parseFloat(el.getAttribute('width')) || 1;
                const height = parseFloat(el.getAttribute('height')) || 1;
                const depth = parseFloat(el.getAttribute('depth')) || 1;
                return new THREE.Vector3(width * scale.x, height * scale.y, depth * scale.z);
            }
        }

        function isWithinSlot(piece, targetSize, tolerance = 0.25) {
            const ps = getRealSize(piece);
            const ss = targetSize;
            return (
                Math.abs(ps.x - ss.x) <= ss.x * tolerance &&
                Math.abs(ps.y - ss.y) <= ss.y * tolerance &&
                Math.abs(ps.z - ss.z) <= ss.z * tolerance
            );
        }

        function snapPieceToSlot(piece, slot) {
            // 1. Remover componentes de interacción.
            // Al remover 'grabbable', se ejecuta síncronamente su método de liberación,
            // lo que devuelve el object3D de la pieza a su contenedor original en Three.js.
            piece.removeAttribute('draggable');
            piece.removeAttribute('grabbable');
            piece.removeAttribute('hoverable');
            piece.removeAttribute('stretchable');

            // 2. Forzar actualización de matrices con su padre restaurado
            if (piece.object3D.parent) {
                piece.object3D.parent.updateMatrixWorld(true);
            }
            piece.object3D.updateMatrixWorld(true);

            // 3. Copiar la posición del slot convertida a coordenadas locales del padre
            const pos = slot.object3D.getWorldPosition(new THREE.Vector3());
            if (piece.object3D.parent) {
                piece.object3D.parent.worldToLocal(pos);
            }
            piece.object3D.position.copy(pos);
            
            // 4. Copiar la rotación del slot convertida a coordenadas locales del padre
            const rot = slot.object3D.getWorldQuaternion(new THREE.Quaternion());
            if (piece.object3D.parent) {
                const parentRot = piece.object3D.parent.getWorldQuaternion(new THREE.Quaternion());
                const localRot = parentRot.clone().invert().multiply(rot);
                piece.object3D.quaternion.copy(localRot);
            } else {
                piece.object3D.quaternion.copy(rot);
            }

            // 5. Ajustar la escala de las piezas automáticamente al tamaño del molde
            if (piece.id === 'piece-cube') {
                piece.setAttribute('scale', '1.5 1.5 1.5');
            } else if (piece.id === 'piece-sphere') {
                const s = 0.10 / 0.18;
                piece.setAttribute('scale', `${s} ${s} ${s}`);
            } else if (piece.id === 'piece-rect') {
                piece.setAttribute('scale', '1 1 1');
            }
        }

        function handleDrop(slot, piece, totalSlots) {
            if (slot.id === 'slot-cube') {
                const ok = isWithinSlot(piece, targetSizes['slot-cube'], 0.25);
                if (!ok) {
                    setInstruction('Agranda el cubo antes de colocarlo');
                    return;
                }
            } else if (slot.id === 'slot-sphere') {
                const ok = isWithinSlot(piece, targetSizes['slot-sphere'], 0.25);
                if (!ok) {
                    setInstruction('Encoge la esfera antes de colocarla');
                    return;
                }
            }

            snapPieceToSlot(piece, slot);
            placed.add(slot.id);
            setInstruction(`Piezas colocadas: ${placed.size}/${totalSlots}`);

            if (placed.size === totalSlots) {
                startButton.setAttribute('color', '#2ecc71');
                startText.setAttribute(
                    'text',
                    'value: Completado; align: center; color: #ffffff; width: 2.2;'
                );
                setInstruction('Completado');
            }
        }

        setInstruction('Paso 1: pulsa el boton para iniciar');

        startButton.addEventListener('click-start', () => {
            if (started) return;
            started = true;
            pieces.setAttribute('visible', true);
            slots.setAttribute('visible', true);
            setInstruction('Paso 2: agranda el cubo, encoge la esfera y coloca las piezas');
        });

        startButton.addEventListener('hover-start', () => {
            if (!started) startButton.setAttribute('color', '#4aa3ff');
        });
        startButton.addEventListener('hover-end', () => {
            if (!started) startButton.setAttribute('color', '#1e90ff');
        });

        document.querySelectorAll('.piece').forEach((el) => {
            el.addEventListener('hover-start', () => {
                el.setAttribute('material', { emissive: '#ffffff', emissiveIntensity: 0.6 });
            });
            el.addEventListener('hover-end', () => {
                el.setAttribute('material', { emissive: '#000000', emissiveIntensity: 0.0 });
            });
        });

        const slotEls = Array.from(document.querySelectorAll('.slot'));
        const totalSlots = slotEls.length;

        slotEls.forEach((slot) => {
            slot.addEventListener('drag-drop', (e) => {
                if (!started) return;
                const piece = e.detail && e.detail.dropped;
                if (!piece) return;
                handleDrop(slot, piece, totalSlots);
            });
        });
    </script>
</body>
